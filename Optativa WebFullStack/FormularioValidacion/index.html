<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario Validaciones</title>
  <link rel="stylesheet" href="./css/principal.css">
  
<body>

  <h2>Formulario de Registro</h2>
  <form action="#">

    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <div id="gApellidos" class="oculto">
      <label for="apellidos">Apellidos: </label><br>
      <input type="text" id="apellido" name="apellido" required><br><br>
    </div>

    <div id="gCorreo" class="oculto">
      <label for="correo">Correo electrónico:</label><br>
      <input type="email" id="correo" name="correo" required><br><br>
    </div>

    <div id="gDireccion" class="oculto">
      <label for="direccion">Direccion: </label><br>
      <input type="text" id="direccion" name="direccion" required><br><br>
    </div>

    <div id="gDni" class="oculto">
      <label for="dni">DNI: </label><br>
      <input type="text" id="dni" name="dni" required><br><br>
    </div>

    <div id="gFecha" class="oculto">
      <label for="fecha_nacimiento">Fecha de nacimiento:</label><br>
      <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required><br><br>
    </div>

    <div id="gContrasena" class="oculto">
      <label for="contrasena">Contraseña:</label><br>
      <input type="password" id="contrasena" name="contrasena" required><br><br>
    </div>

    <div id="gConfirmar" class="oculto">
      <label for="confirmar_contrasena">Repetir contraseña:</label><br>
      <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" required><br><br>
    </div>

    <div id="gGenero" class="oculto">
      <label>Género:</label><br>
      <input type="radio" id="masculino" name="genero" value="masculino">
      <label for="masculino">Masculino</label><br>
      <input type="radio" id="femenino" name="genero" value="femenino">
      <label for="femenino">Femenino</label><br>
      <input type="radio" id="otro" name="genero" value="otro">
      <label for="otro">Otro</label><br><br>
    </div>

    <div id="gPais" class="oculto">
      <label for="pais">País:</label><br>
      <select id="pais" name="pais" required>
        <option value="">Seleccione una opción</option>
        <option value="mexico">España</option>
        <option value="espana">Portugal</option>
        <option value="argentina">Francia</option>
        <option value="colombia">Reino Unido</option>
        <option value="otro">Otro</option>
      </select><br><br>
    </div>

    <button type="submit" id="registro">Registrarse</button>
  </form>

  <script src="./js/validacion.js"></script>
</body>
</html>

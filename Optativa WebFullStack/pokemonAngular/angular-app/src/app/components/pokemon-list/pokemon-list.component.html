<div class="container mt-5">
  <h1 class="mb-4">CRUD MONGO - Pokémon</h1>
  
  <a routerLink="/crear" class="btn btn-success btn-block mb-4">
    Crear nuevo Pokemon
  </a>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nombre</th>
          <th scope="col">Tipo</th>
          <th scope="col">Descripción</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pokemon of pokemonList; let i = index">
          <th scope="row">{{ i + 1 }}</th>
          <td>{{ pokemon.nombre }}</td>
          <td>{{ pokemon.tipo }}</td>
          <td>{{ pokemon.descripcion }}</td>
          <td>
            <a 
              [routerLink]="['/editar', pokemon._id]" 
              class="btn btn-warning btn-sm me-2"
            >
              Editar
            </a>
            <button 
              (click)="deletePokemon(pokemon._id)" 
              class="btn btn-danger btn-sm"
            >
              Eliminar
            </button>
          </td>
        </tr>
        <tr *ngIf="pokemonList.length === 0">
          <td colspan="5" class="text-center">No hay pokemon registrados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="container mt-5">
  <h1 class="mb-4">Detalles del Pokémon</h1>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="error && !loading" class="alert alert-danger" role="alert">
    {{ error }}
    <br>
    <button class="btn btn-dark btn-sm mt-2" (click)="onCancel()">
      Volver
    </button>
  </div>

  <div *ngIf="!loading && !error">
    <form (ngSubmit)="onSubmit()" #pokemonForm="ngForm">
      <div class="mb-3">
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="pokemon.nombre"
          name="nombre"
          required
          placeholder="Nombre"
        >
      </div>

      <div class="mb-3">
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="pokemon.tipo"
          name="tipo"
          required
          placeholder="Tipo"
        >
      </div>

      <div class="mb-3">
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="pokemon.descripcion"
          name="descripcion"
          required
          placeholder="Descripción"
        >
      </div>

      <button 
        type="submit" 
        class="btn btn-warning btn-sm me-2"
        [disabled]="saving || !pokemonForm.valid"
      >
        <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span>
        {{ saving ? 'Guardando...' : 'Editar' }}
      </button>

      <button 
        type="button" 
        class="btn btn-secondary btn-sm"
        (click)="onCancel()"
        [disabled]="saving"
      >
        Cancelar
      </button>
    </form>

    <hr class="my-4">

    <button 
      class="btn btn-danger btn-sm" 
      (click)="deletePokemon()"
      [disabled]="saving"
    >
      Eliminar
    </button>
  </div>
</div>

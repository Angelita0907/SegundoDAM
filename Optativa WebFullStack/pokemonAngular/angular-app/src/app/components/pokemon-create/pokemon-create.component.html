<div class="container mt-5">
  <h1 class="mb-4">Crear nuevo Pokémon</h1>

  <div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <form (ngSubmit)="onSubmit()" #pokemonForm="ngForm">
    <div class="mb-3">
      <input 
        type="text" 
        class="form-control" 
        placeholder="Nombre Pokemon" 
        [(ngModel)]="pokemon.nombre"
        name="nombre"
        required
      >
    </div>

    <div class="mb-3">
      <input 
        type="text" 
        class="form-control" 
        placeholder="Tipo Pokemon" 
        [(ngModel)]="pokemon.tipo"
        name="tipo"
        required
      >
    </div>

    <div class="mb-3">
      <input 
        type="text" 
        class="form-control" 
        placeholder="Descripción Pokemon" 
        [(ngModel)]="pokemon.descripcion"
        name="descripcion"
        required
      >
    </div>

    <button 
      type="submit" 
      class="btn btn-dark btn-block me-2"
      [disabled]="loading || !pokemonForm.valid"
    >
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
      {{ loading ? 'Creando...' : 'Agregar' }}
    </button>

    <button 
      type="button" 
      class="btn btn-secondary"
      (click)="onCancel()"
      [disabled]="loading"
    >
      Cancelar
    </button>
  </form>
</div>

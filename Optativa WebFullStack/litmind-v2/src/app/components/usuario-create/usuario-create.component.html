<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <a routerLink="/usuarios" class="back-link">Volver al listado</a>
      <h1>Nuevo Usuario</h1>
    </div>

    <div class="avatar-preview" *ngIf="usuario.foto">
      <img [src]="usuario.foto" alt="Vista previa" class="avatar-img">
      <span>Vista previa del avatar</span>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" [(ngModel)]="usuario.nombre" name="nombre" placeholder="Ej: Diego Garcia" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="usuario.email" name="email" placeholder="diego@litmind.app" required>
      </div>
      <div class="form-group">
        <label for="password">Contrasena</label>
        <input type="password" id="password" [(ngModel)]="usuario.password" name="password" placeholder="Contrasena" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="rol">Rol</label>
          <select id="rol" [(ngModel)]="usuario.rol" name="rol">
            <option value="estudiante">Estudiante</option>
            <option value="profesor">Profesor</option>
            <option value="padre">Padre/Madre</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="form-group">
          <label for="nivel">Nivel lector</label>
          <select id="nivel" [(ngModel)]="usuario.nivel" name="nivel">
            <option value="principiante">Principiante</option>
            <option value="intermedio">Intermedio</option>
            <option value="avanzado">Avanzado</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="foto">URL de foto de perfil</label>
        <input type="text" id="foto" [(ngModel)]="usuario.foto" name="foto" placeholder="https://...">
      </div>
      <div class="button-group">
        <button type="submit" class="btn btn-primary">Crear usuario</button>
        <button type="button" (click)="onCancel()" class="btn btn-ghost">Cancelar</button>
      </div>
    </form>
  </div>
</div>

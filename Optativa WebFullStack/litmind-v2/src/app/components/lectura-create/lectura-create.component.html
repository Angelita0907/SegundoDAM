<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <a routerLink="/lecturas" class="back-link">Volver al listado</a>
      <h1>Nueva Lectura</h1>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="titulo">Titulo</label>
        <input type="text" id="titulo" [(ngModel)]="lectura.titulo" name="titulo" placeholder="Ej: El Principito" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="genero">Genero</label>
          <input type="text" id="genero" [(ngModel)]="lectura.genero" name="genero" placeholder="Ej: Fantasia, Novela..." required>
        </div>
        <div class="form-group">
          <label for="nivel">Nivel</label>
          <select id="nivel" [(ngModel)]="lectura.nivel" name="nivel">
            <option value="principiante">Principiante</option>
            <option value="intermedio">Intermedio</option>
            <option value="avanzado">Avanzado</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="resena">Resena</label>
        <textarea id="resena" [(ngModel)]="lectura.resena" name="resena" rows="4" placeholder="Breve descripcion del libro..." required></textarea>
      </div>
      <div class="button-group">
        <button type="submit" class="btn btn-primary">Guardar lectura</button>
        <button type="button" (click)="onCancel()" class="btn btn-ghost">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon"><img src="logo-app.png" alt="logo"></span>
      <h1>LitMind</h1>
      <p>Tu app de comprensión lectora</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Ej: diego@litmind.app"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Tu contraseña"
          required
        >
      </div>

      <div class="error-msg" *ngIf="error">
         {{ error }}
      </div>

      <button type="submit" class="btn btn-login">Entrar</button>
    </form>

    <div class="login-hint">
      <p><strong>Usuarios de prueba:</strong></p>
      <p>admin&#64;litmind.app / admin123</p>
      <p>diego&#64;litmind.app / 1234</p>
      <p>ana&#64;litmind.app / 1234</p>
    </div>
  </div>
</div>

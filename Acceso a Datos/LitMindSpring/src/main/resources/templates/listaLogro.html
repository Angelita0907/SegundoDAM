<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
	<head>
		 <meta charset="UTF-8">
		 <title>Logros</title>
	</head>
	<body>
		<table>
		       <thead>
		           <tr>
		               <th>Nombre del Logro</th>
		               <th>Descripcion</th>
					   <th>Categoria</th>
		           </tr>
		       </thead>
		       <tbody>
		           <tr th:each="logro : ${logros}">
		               <td th:text="${logro.nombreLogro}">Nombre</td>
		               <td th:text="${logro.descripcion}">Descripcion</td>
					   <td th:text="${logro.categoria}">Categoria</td>
		           </tr>
		       </tbody>
		   </table>
	</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
	<head>
		 <meta charset="UTF-8">
		 <title>Lecturas</title>
	</head>
	<body>
		<table>
		       <thead>
		           <tr>
		               <th>Titulo de la Lectura</th>
		               <th>Autor</th>
					   <th>Género</th>
		           </tr>
		       </thead>
		       <tbody>
		           <tr th:each="lectura : ${lecturas}">
		               <td th:text="${lectura.titulo}">Titulo</td>
		               <td th:text="${lectura.autor}">Autor</td>
					   <td th:text="${lectura.genero}">Genero</td>
		           </tr>
		       </tbody>
		   </table>
	</body>
</html>
